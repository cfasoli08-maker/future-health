<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mom's Questions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root{
    --ground:#FBF7F0; --card:#FFFFFF; --ink:#1B2430; --muted:#5A6472;
    --fire:#E8611A; --copper:#B87333; --sun:#F2B722; --blue:#1F5FA8; --sky:#E4EEF9;
    --line:#E3DBCF; --ok:#1E7F4F;
    color-scheme: light;
  }
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"Atkinson Hyperlegible",Arial,Helvetica,sans-serif;font-size:20px;line-height:1.45;
    padding-inline:16px;padding-block:8px;}
  .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 6px}
  .brand{font-weight:700;color:var(--copper);letter-spacing:.04em;text-transform:uppercase;font-size:14px}
  .count{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:10px;background:#EFE7DA;border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--sun));transition:width .25s}
  .sec{margin-top:18px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-top:10px;
    box-shadow:0 6px 24px rgba(184,115,51,.08)}
  h1{font-size:28px;line-height:1.2;margin:0 0 8px;text-wrap:balance}
  h2{font-size:26px;line-height:1.25;margin:0 0 18px;text-wrap:balance}
  p{margin:0 0 12px}
  .intro{color:var(--muted);font-size:18px}
  .yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 16px}
  button{font:inherit;cursor:pointer}
  .choice{border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:18px 10px;
    font-size:26px;font-weight:700;min-height:72px}
  .choice.on{border-color:var(--fire);background:#FFF1E8;color:#9A3C0B}
  .choice:focus-visible,.go:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  label.small{display:block;font-size:16px;color:var(--muted);margin-bottom:6px}
  textarea,input[type=text],input[type=number]{width:100%;box-sizing:border-box;font:inherit;font-size:20px;padding:12px 14px;
    border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  textarea{min-height:96px;resize:vertical}
  .nav{display:flex;gap:12px;margin-top:18px}
  .go{flex:1;border:0;border-radius:14px;padding:16px;font-size:22px;font-weight:700;background:var(--fire);color:#fff;min-height:64px}
  .go.quiet{background:var(--sky);color:var(--blue);flex:0 0 auto;padding-inline:20px}
  .go[disabled]{opacity:.45;cursor:default}
  .hint{font-size:16px;color:var(--muted);margin-top:14px}
  .big{font-size:22px}
  .out{white-space:pre-wrap;font-size:16px;background:#FFF8EC;border:1px dashed var(--copper);border-radius:12px;padding:14px;
    max-height:40vh;overflow:auto;margin-top:12px}
  .done{color:var(--ok);font-weight:700}
  footer{margin-top:auto;padding-block:14px;font-size:14px;color:var(--muted);text-align:center}
  @media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Future Health</div>
    <div class="count" id="count"></div>
  </header>
  <div class="bar"><i id="fill"></i></div>
  <div class="sec" id="secname"></div>
  <div class="card" id="card"></div>
  <footer>From Christopher. Stop any time. It saves where you are.</footer>
</div>

<script>
// Valerie intake. One question per screen. yn = Yes/No with a note box. text = short answer. num = a number.
// Every question fills a hole named in the 23 Sep 2026 clinical brief. The note after each id says which.
const SECTIONS = [
  { key: "start", title: "First, the big picture", intro: "Two quick ones in your own words." },
  { key: "gut", title: "The whoosh", intro: "Food is not the cause. We proved that. So these ask about everything else around a whoosh." },
  { key: "night", title: "Your night", intro: "Your sleep score is falling while your hours stay the same. These find out why." },
  { key: "energy", title: "Your energy", intro: "Your pain is down but your energy is down too. These sort out what kind of tired it is." },
  { key: "sugar", title: "Your morning number", intro: "Your morning number has been climbing. These look at the night before it." },
  { key: "nerves", title: "Nerves, balance and feet", intro: "The nerve problem that drives the whoosh can show up in other places too." },
  { key: "pain", title: "Pain and Tylenol", intro: "So we treat the pain right, and know exactly what it is for." },
  { key: "history", title: "Your history and records", intro: "Things no app can know unless you tell it." },
  { key: "end", title: "Last one", intro: "" }
];

const QUESTIONS = [
  // START
  { id: "s1", sec: "start", type: "text", q: "What bothers you most, day to day, right now? Name the top three, worst first." },
  { id: "s2", sec: "start", type: "text", q: "If one thing could be fixed by Christmas, what would it be?" },

  // GUT. Brief s4: 14 days no warning, random timing, night gurgle. Brief s12 q4: cream unanswered.
  { id: "g1", sec: "gut", type: "yn", q: "In the hour before a whoosh, are you usually up and moving? Walking, stairs, chores." },
  { id: "g2", sec: "gut", type: "yn", q: "Do whooshes ever come while you are sitting still or lying down?" },
  { id: "g3", sec: "gut", type: "yn", q: "Do they come mostly in the first two hours after you get up?" },
  { id: "g4", sec: "gut", type: "yn", q: "Do they come within an hour of your morning coffee with cream?" },
  { id: "g5", sec: "gut", type: "yn", q: "Do they come within an hour of a meal?" },
  { id: "g6", sec: "gut", type: "yn", q: "Do they ever wake you at night, or come before 6 in the morning?" },
  { id: "g7", sec: "gut", type: "yn", q: "Right before one, do you ever feel hot, sweaty, faint, or your heart racing?" },
  { id: "g8", sec: "gut", type: "yn", q: "Is the stool ever pale, grey, greasy, or does it float?" },
  { id: "g9", sec: "gut", type: "yn", q: "Is there ever blood, or a black tar-like stool?" },
  { id: "g10", sec: "gut", type: "yn", q: "Do you get more whooshes on days you are worried or upset?" },
  { id: "g11", sec: "gut", type: "yn", q: "Do you feel full after only a few bites?" },
  { id: "g12", sec: "gut", type: "yn", q: "Do you feel sick to your stomach most days?" },
  { id: "g14", sec: "gut", type: "yn", q: "Does your belly swell up by evening?" },
  { id: "g15", sec: "gut", type: "yn", q: "Does food ever feel stuck, or is it hard to swallow?" },
  { id: "g16", sec: "gut", type: "yn", q: "Has your gallbladder been removed?" },
  { id: "g17", sec: "gut", type: "yn", q: "Have you ever had a camera scope of your stomach or bowel? If yes, when?" },
  { id: "g18", sec: "gut", type: "yn", q: "Have you taken antibiotics in the last year? If yes, what for?" },
  { id: "g19", sec: "gut", type: "yn", q: "Does your bladder ever go without warning, or do you leak?" },

  // NIGHT. Brief s3: quality 5.30 to 3.08, wake-ups 1.48 to 2.23. s11: knee, pee, position.
  { id: "n1", sec: "night", type: "yn", q: "When you wake at night, is it your left knee most often?" },
  { id: "n2", sec: "night", type: "yn", q: "Is it the need to pee most often?" },
  { id: "n3", sec: "night", type: "yn", q: "Is it your gut most often? Gurgle, cramp, or a whoosh." },
  { id: "n4", sec: "night", type: "yn", q: "Is it your back or hips, not being able to get comfy?" },
  { id: "n5", sec: "night", type: "yn", q: "Do you wake up hot or sweaty?" },
  { id: "n6", sec: "night", type: "yn", q: "Do you wake up thirsty or with a dry mouth?" },
  { id: "n7", sec: "night", type: "yn", q: "Do you wake up hungry, shaky, or with a headache?" },
  { id: "n8", sec: "night", type: "yn", q: "Do you snore, or has anyone said you stop breathing in your sleep?" },
  { id: "n9", sec: "night", type: "yn", q: "Once you are awake, are you up more than 20 minutes?" },
  { id: "n10", sec: "night", type: "num", q: "How many times do you get up to pee in a night, most nights?" },
  { id: "n11", sec: "night", type: "yn", q: "Do you feel rested when you get up?" },
  { id: "n13", sec: "night", type: "text", q: "What time do you go to bed, and what time do you get up?" },

  // ENERGY. Brief s3: 4.67 to 3.11. s11: physical fatigue, not mood. Stress cause 0 of 60.
  { id: "e1", sec: "energy", type: "yn", q: "Is your energy lowest in the morning?" },
  { id: "e2", sec: "energy", type: "yn", q: "Does your energy drop after you eat?" },
  { id: "e3", sec: "energy", type: "yn", q: "Does it drop after walking or stairs, and take a long time to come back?" },
  { id: "e4", sec: "energy", type: "yn", q: "Do you get short of breath on stairs or a short walk?" },
  { id: "e5", sec: "energy", type: "yn", q: "Do your legs feel heavy or weak, not just sore?" },
  { id: "e6", sec: "energy", type: "yn", q: "Do you feel your heart pound, race, or skip?" },
  { id: "e7", sec: "energy", type: "yn", q: "Do you feel cold when other people are warm?" },
  { id: "e8", sec: "energy", type: "yn", q: "Are your arms and legs thinner than in March?" },
  { id: "e10", sec: "energy", type: "yn", q: "Do you feel low, sad, or flat most days?" },
  { id: "e11", sec: "energy", type: "yn", q: "Do you feel worried or on edge most days?" },
  { id: "e12", sec: "energy", type: "text", q: "When you mark stress in the app, what is it usually about?" },

  // SUGAR. Brief: mornings 7.33 to 8.30, no diet change. Under-eating is the proven driver. Coffee before or after vitals unclear.
  { id: "b1", sec: "sugar", type: "yn", q: "Is your coffee with cream before your morning finger poke, or after? Yes means before." },
  { id: "b2", sec: "sugar", type: "yn", q: "Do you eat anything after supper?" },
  { id: "b3", sec: "sugar", type: "yn", q: "On a high morning, was supper the night before small or skipped?" },
  { id: "b4", sec: "sugar", type: "yn", q: "On a high morning, did you wake between 3 and 5?" },
  { id: "b5", sec: "sugar", type: "yn", q: "Are you more thirsty than a month ago?" },
  { id: "b6", sec: "sugar", type: "yn", q: "Are you peeing more in the daytime than a month ago?" },
  { id: "b7", sec: "sugar", type: "yn", q: "In the last three weeks, any cold, sore throat, sore tooth, sore gums, or a bladder infection?" },
  { id: "b8", sec: "sugar", type: "yn", q: "Any cut, sore, or blister that is slow to heal?" },

  // NERVES. Brief s1: autonomic neuropathy, clinical. s8: fall is the real risk. Balance is structural.
  { id: "v1", sec: "nerves", type: "yn", q: "Are your feet numb, tingly, or burning?" },
  { id: "v2", sec: "nerves", type: "yn", q: "In the dark, can you tell where your feet are without looking?" },
  { id: "v3", sec: "nerves", type: "yn", q: "Do you get dizzy or see spots when you stand up fast?" },
  { id: "v4", sec: "nerves", type: "yn", q: "Do you sweat less than you used to, or sweat oddly, like your face after eating?" },
  { id: "v5", sec: "nerves", type: "yn", q: "Do you have dry eyes or a dry mouth in the day?" },
  { id: "v7", sec: "nerves", type: "yn", q: "Have you fallen, or nearly fallen, since June?" },
  { id: "v8", sec: "nerves", type: "yn", q: "Is your left knee worse now than before the right one was replaced?" },
  { id: "v9", sec: "nerves", type: "yn", q: "Does your back pain run down into a leg?" },

  // PAIN. Brief s7: acetaminophen 41 of 72 days, morning and bedtime.
  { id: "p1", sec: "pain", type: "text", q: "Where is your worst pain right now? Name the spot." },
  { id: "p2", sec: "pain", type: "text", q: "The morning Tylenol. Is it for the knee, the back, or both?" },
  { id: "p3", sec: "pain", type: "yn", q: "Do you take Tylenol before the pain starts, out of habit?" },
  { id: "p4", sec: "pain", type: "yn", q: "Does the pain stop you from walking or doing stairs?" },
  { id: "p5", sec: "pain", type: "yn", q: "Do you take any other pill, cream, or patch for pain? If yes, what?" },

  // HISTORY. Brief s12: no bloodwork since March, no kidney, liver, thyroid, bone, med list, weight history, the March infection.
  { id: "h1", sec: "history", type: "yn", q: "Since March, have you had any blood test at all? If yes, when and where?" },
  { id: "h2", sec: "history", type: "yn", q: "Has a doctor ever said your kidneys were off?" },
  { id: "h3", sec: "history", type: "yn", q: "Has a doctor ever said your liver was off?" },
  { id: "h4", sec: "history", type: "yn", q: "Has a doctor ever said your thyroid was off?" },
  { id: "h5", sec: "history", type: "yn", q: "Have you had a bone density scan? If yes, when?" },
  { id: "h6", sec: "history", type: "yn", q: "Have you broken a bone as an adult? If yes, which?" },
  { id: "h7", sec: "history", type: "text", q: "The infection in March. What was it, and what cleared it?" },
  { id: "h8", sec: "history", type: "text", q: "Any pill, vitamin, or drop you take that is not in the app? Name each one." },
  { id: "h9", sec: "history", type: "text", q: "What did you weigh a year ago? And five years ago? Your best guess is fine." },
  { id: "h10", sec: "history", type: "text", q: "Your parents, brothers and sisters. Any diabetes, heart trouble, thyroid, gut disease, or cancer? Who had what?" },
  { id: "h11", sec: "history", type: "yn", q: "Have you ever smoked?" },
  { id: "h13", sec: "history", type: "yn", q: "Do you take anything to sleep? Melatonin, an antihistamine, anything." },

  // END
  { id: "z1", sec: "end", type: "text", q: "Is there anything you think is going on that nobody has asked you about?" }
];


// Where finished answers go. Leave blank to use the copy-and-text screen only.
const SEND_URL = "https://script.google.com/macros/s/AKfycbxk63K8D509qmhIyQ5lwGec2OLfrtwlnogZKLhcBZlCOqi7lNjS9XrWvv8O89r4psoJ/exec";
const KEY = "valerie-intake-v1";

let state = { i: -1, a: {}, sent: false, started: "" };
try { const s = localStorage.getItem(KEY); if (s) state = Object.assign(state, JSON.parse(s)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const card = document.getElementById("card");
const fill = document.getElementById("fill");
const count = document.getElementById("count");
const secname = document.getElementById("secname");
const N = QUESTIONS.length;
const secOf = k => SECTIONS.find(s => s.key === k);

function esc(t){ return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  save();
  if (state.i < 0) return welcome();
  if (state.i >= N) return finish();
  const q = QUESTIONS[state.i];
  const ans = state.a[q.id] || {};
  const first = state.i === 0 || QUESTIONS[state.i-1].sec !== q.sec;
  const sec = secOf(q.sec);
  fill.style.width = Math.round((state.i / N) * 100) + "%";
  count.textContent = (state.i + 1) + " of " + N;
  secname.textContent = sec.title;
  let h = "";
  if (first && sec.intro) h += '<p class="intro">' + esc(sec.intro) + '</p>';
  h += '<h2>' + esc(q.q) + '</h2>';
  if (q.type === "yn") {
    h += '<div class="yn">' +
      '<button class="choice' + (ans.v === "Yes" ? " on" : "") + '" id="yes" type="button">Yes</button>' +
      '<button class="choice' + (ans.v === "No" ? " on" : "") + '" id="no" type="button">No</button></div>' +
      '<label class="small" for="note">Anything to add? (you can skip this)</label>' +
      '<textarea id="note">' + esc(ans.n || "") + '</textarea>';
  } else if (q.type === "num") {
    h += '<input type="number" id="val" inputmode="numeric" min="0" max="20" value="' + esc(ans.v || "") + '">' +
      '<label class="small" for="note" style="margin-top:10px">Anything to add? (you can skip this)</label>' +
      '<textarea id="note">' + esc(ans.n || "") + '</textarea>';
  } else {
    h += '<label class="small" for="val">Type your answer</label>' +
      '<textarea id="val" style="min-height:130px">' + esc(ans.v || "") + '</textarea>';
  }
  h += '<div class="nav"><button class="go quiet" id="back" type="button">Back</button>' +
       '<button class="go" id="next" type="button">Next</button></div>';
  card.innerHTML = h;

  const yes = document.getElementById("yes"), no = document.getElementById("no");
  const note = document.getElementById("note"), val = document.getElementById("val");
  const next = document.getElementById("next");
  function cur(){
    const o = state.a[q.id] || {};
    if (q.type === "yn") { if (note) o.n = note.value.trim(); }
    else { o.v = val.value.trim(); if (note) o.n = note.value.trim(); }
    state.a[q.id] = o; save();
  }
  function ready(){
    const o = state.a[q.id] || {};
    const ok = q.type === "yn" ? !!o.v : !!(val && val.value.trim());
    next.disabled = !ok;
  }
  if (yes) yes.onclick = () => { state.a[q.id] = Object.assign(state.a[q.id]||{}, {v:"Yes"}); yes.classList.add("on"); no.classList.remove("on"); cur(); ready(); };
  if (no) no.onclick = () => { state.a[q.id] = Object.assign(state.a[q.id]||{}, {v:"No"}); no.classList.add("on"); yes.classList.remove("on"); cur(); ready(); };
  if (val) val.oninput = () => { cur(); ready(); };
  if (note) note.oninput = cur;
  ready();
  next.onclick = () => { cur(); state.i++; render(); window.scrollTo(0,0); };
  document.getElementById("back").onclick = () => { cur(); state.i--; render(); window.scrollTo(0,0); };
}

function welcome(){
  fill.style.width = "0%"; count.textContent = ""; secname.textContent = "";
  const done = Object.keys(state.a).length;
  card.innerHTML =
    '<h1>Mom, a few questions from me.</h1>' +
    '<p class="big">There are ' + N + ' of them. Most are Yes or No. Tap one, add a note if you like, tap Next.</p>' +
    '<p class="big">No wrong answers. If you are not sure, pick the one that is true most days and say so in the note.</p>' +
    '<p class="big">You can stop any time. It saves where you are. When you open it again it goes right back.</p>' +
    '<div class="nav"><button class="go" id="start" type="button">' + (done ? "Keep going" : "Start") + '</button></div>';
  document.getElementById("start").onclick = () => { if (!state.started) state.started = new Date().toISOString(); state.i = done ? firstBlank() : 0; render(); };
}
function firstBlank(){ for (let k = 0; k < N; k++){ const o = state.a[QUESTIONS[k].id]; if (!o || !o.v) return k; } return N; }

function asText(){
  let out = "VALERIE INTAKE. Finished " + new Date().toLocaleString() + "\n";
  let lastSec = "";
  for (const q of QUESTIONS){
    if (q.sec !== lastSec){ lastSec = q.sec; out += "\n== " + secOf(q.sec).title.toUpperCase() + " ==\n"; }
    const o = state.a[q.id] || {};
    out += q.id + ". " + q.q + "\n   -> " + (o.v || "(blank)") + (o.n ? "  | note: " + o.n : "") + "\n";
  }
  return out;
}
function asRows(){
  return QUESTIONS.map(q => { const o = state.a[q.id] || {}; return { id:q.id, section:secOf(q.sec).title, question:q.q, answer:o.v||"", note:o.n||"" }; });
}

async function send(btn, status){
  btn.disabled = true; status.textContent = "Sending...";
  try {
    await fetch(SEND_URL, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain" },
      body: JSON.stringify({ who:"Valerie", finished:new Date().toISOString(), started:state.started, rows:asRows() }) });
    state.sent = true; save();
    status.innerHTML = '<span class="done">Sent. Christopher has it. Thank you, Mom.</span>';
  } catch (e) {
    btn.disabled = false;
    status.textContent = "It did not send. Try again, or use the copy button below and text it to me.";
  }
}

function finish(){
  fill.style.width = "100%"; count.textContent = N + " of " + N; secname.textContent = "All done";
  const blanks = QUESTIONS.filter(q => !(state.a[q.id]||{}).v).length;
  let h = '<h1>That is all of them.</h1>';
  if (blanks) h += '<p class="big">' + blanks + ' left blank. That is fine. Tap Back if you want to fill them.</p>';
  if (SEND_URL) {
    h += '<p class="big">Tap Send and it goes straight to me.</p>' +
         '<div class="nav"><button class="go" id="send" type="button">Send to Christopher</button></div>' +
         '<p class="hint" id="status">' + (state.sent ? '<span class="done">Already sent. You can send again if you changed something.</span>' : '') + '</p>';
  }
  h += '<p class="big" style="margin-top:18px">' + (SEND_URL ? 'If Send does not work: ' : '') + 'tap Copy, then paste it into a text to me.</p>' +
       '<div class="nav"><button class="go" id="copy" type="button" style="background:var(--blue)">Copy my answers</button>' +
       '<button class="go quiet" id="back" type="button">Back</button></div>' +
       '<p class="hint" id="copied"></p>' +
       '<div class="out" id="out">' + esc(asText()) + '</div>';
  card.innerHTML = h;
  const sendBtn = document.getElementById("send");
  if (sendBtn) sendBtn.onclick = () => send(sendBtn, document.getElementById("status"));
  document.getElementById("copy").onclick = async () => {
    const t = asText(); const c = document.getElementById("copied");
    try { await navigator.clipboard.writeText(t); c.innerHTML = '<span class="done">Copied. Now open your texts and paste.</span>'; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById("out")); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); c.textContent = "Your answers are selected below. Press and hold, then Copy."; }
  };
  document.getElementById("back").onclick = () => { state.i = N - 1; render(); window.scrollTo(0,0); };
}

render();
</script>

</body>
</html>
